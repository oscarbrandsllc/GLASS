<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Glass Effects — Focus v14 (fixed Neon rim, working Bevel/Double, more sliders on Ringed/Scratches, frost tint)</title>
<style>
:root{
  --font-sans: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
  --color-text-primary:#EAEBF0; --color-text-secondary:#9096C0;
  --color-panel-bg: rgba(22,24,43,0.12); --color-panel-border: rgba(128,138,189,0.20);
  --card-radius:18px;
}
html,body{height:100%;margin:0;background:#0b0b12;color:var(--color-text-primary);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
/* Backdrop reminder: needs translucency to take effect per MDN */
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(660px 660px at 20% -20%, rgba(52,11,113,0.05) 1%, rgba(150,0,120,0.05) 42%, rgba(115,48,250,0.10) 62%, rgba(187,0,148,0.05) 82%, rgba(255,255,255,0) 100%),
  radial-gradient(460px 460px at 90% 10%, rgba(52,11,113,0.35) 1%, rgba(20,48,50,0.25) 32%, rgba(50,0,20,0.10) 62%, rgba(87,0,48,0.10) 82%, rgba(255,255,255,0) 100%),
  radial-gradient(ellipse at 50% 100%, #1B2735 0%, #090A0F 100%);
  background-repeat:no-repeat}
#stars,#stars1{position:absolute;left:0;top:0}
#stars1{width:1px;height:2px;background:transparent;border-radius:20px;box-shadow:1528px 425px #FF4089,1965px 1848px #F08cd1,466px 588px #008cd1,1441px 1361px #008cd1,1403px 1363px #FF00FF,1010px 54px #008cd1,904px 1539px #6300FF,929px 1400px #7300ff,1370px 1286px #008cd1,612px 1109px #9900FF,1899px 1371px #FF4089,215px 873px #E86439;animation:animStar 450s linear infinite}
#stars{width:1px;height:1px;background:transparent;border-radius:20px;box-shadow:1528px 425px #FFF,1965px 1848px #FFF,466px 588px #FFF,1441px 1361px #FFF,395px 1296px #FFF,1603px 1631px #FFF,1403px 1363px #FFF,1010px 54px #FFF,904px 1539px #FFF,929px 1400px #FFF,1370px 1286px #FFF,612px 1109px #FFF;animation:animStar 300s linear infinite}
@keyframes animStar{from{transform:translateY(0)}to{transform:translateY(-2000px)}}
#noise-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.25;mix-blend-mode:overlay;background-image:radial-gradient(circle at 50% 50%, rgba(255,255,255,.02) 0 1px, transparent 1px 100%),radial-gradient(circle at 10% 20%, rgba(255,255,255,.02) 0 1px, transparent 1px 100%)}
/* Layout */
header{position:sticky;top:0;z-index:2;padding:10px 14px;text-align:center;background:linear-gradient(180deg, rgba(11,11,18,.28) 10%, transparent 100%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(128,138,189,.2)}
h1{margin:0;font-size:1.05rem;letter-spacing:.4px}
.container{position:relative;z-index:1;max-width:1440px;margin:18px auto 80px;padding:0 14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(320px,1fr));gap:18px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(300px,1fr))}}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
/* Card */
.card{position:relative;overflow:hidden;min-height:360px;padding:14px;border-radius:var(--card-radius);border:1px solid rgba(255,255,255,.18);background:rgba(22,24,43,.10);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 28px rgba(0,0,0,var(--outerA,.22));display:flex;flex-direction:column;gap:8px}
.title{font-weight:700;font-size:1rem;letter-spacing:.35px}
.meta{font-size:.86rem;color:var(--color-text-secondary)}
.pill{align-self:flex-start;display:inline-block;padding:2px 8px;border-radius:9999px;font-size:.72rem;color:#0b0b12;background:#c9d1ff;font-weight:700;letter-spacing:.2px}
.controls{margin-top:auto;padding-top:8px;border-top:1px dashed rgba(255,255,255,.12);display:grid;gap:6px}
.control{display:grid;grid-template-columns: 1fr 1fr 74px;align-items:center;gap:6px}
.control label{font-size:.74rem;color:var(--color-text-secondary)}
.control code{font-size:.70rem;opacity:.9}
.control input[type=range]{width:100%}
.control output{text-align:right;font-variant-numeric:tabular-nums;font-size:.78rem;color:#d8dbff}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button.copy{appearance:none;-webkit-appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#e7e9ff;padding:6px 10px;border-radius:10px;font-size:.78rem;cursor:pointer}
button.copy:hover{background:rgba(255,255,255,.12)}
.decls{margin-top:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:10px 12px;overflow:auto;max-height:260px;font-size:.76rem}
.decls pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#dfe3ff}
/* Range input styling */
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:rgba(255,255,255,.18);border-radius:9999px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-6px;width:16px;height:16px;border-radius:50%;background:#e7e9ff;border:1px solid rgba(0,0,0,.3)}
input[type=range]::-moz-range-track{height:4px;background:rgba(255,255,255,.18);border-radius:9999px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#e7e9ff;border:1px solid rgba(0,0,0,.3)}

/* ---- Glass styles (improved) ---- */
/* SOFT */
.glass-soft{
  background-color:rgba(13,14,35,var(--soft-bgA,0.10));
  -webkit-backdrop-filter:blur(var(--soft-blur,6px)) saturate(var(--soft-sat,110%));
  backdrop-filter:blur(var(--soft-blur,6px)) saturate(var(--soft-sat,110%));
}
/* HEAVY FROST with optional white frost tint */
.glass-heavy{
  background-color:rgba(13,14,35,var(--heavy-bgA,0.22));
  background-image: linear-gradient(rgba(255,255,255,var(--heavy-frost,0.00)), rgba(255,255,255,var(--heavy-frost,0.00)));
  background-blend-mode: screen;
  -webkit-backdrop-filter:blur(var(--heavy-blur,18px)) saturate(var(--heavy-sat,130%));
  backdrop-filter:blur(var(--heavy-blur,18px)) saturate(var(--heavy-sat,130%));
}
/* DIM/BRIGHT/TINT */
.glass-dim{background-color:rgba(13,14,35,var(--dim-bgA,0.26));-webkit-backdrop-filter:blur(var(--dim-blur,14px)) brightness(var(--dim-bright,0.90)) saturate(var(--dim-sat,115%));backdrop-filter:blur(var(--dim-blur,14px)) brightness(var(--dim-bright,0.90)) saturate(var(--dim-sat,115%))}
.glass-bright{background-color:rgba(13,14,35,var(--bright-bgA,0.12));-webkit-backdrop-filter:blur(var(--bright-blur,12px)) brightness(var(--bright-bright,1.08)) saturate(var(--bright-sat,125%));backdrop-filter:blur(var(--bright-blur,12px)) brightness(var(--bright-bright,1.08)) saturate(var(--bright-sat,125%))}
.glass-tint-purple{background-color:rgba(115,0,255,var(--tint-alpha,0.18));-webkit-backdrop-filter:blur(var(--tint-blur,12px)) saturate(var(--tint-sat,120%));backdrop-filter:blur(var(--tint-blur,12px)) saturate(var(--tint-sat,120%))}
/* GLOSS */
.glass-glossy::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg, rgba(255,255,255,var(--gloss-alpha,0.18)), rgba(255,255,255,0) 35%)}
/* TEXTURE */
.glass-texture{background-image:repeating-linear-gradient(0deg, rgba(255,255,255,var(--texture-alpha,0.06)) 0 var(--texture-line,1px), transparent var(--texture-line,1px) var(--texture-gap,3px)),repeating-linear-gradient(90deg, rgba(255,255,255,var(--texture-alpha2,0.05)) 0 var(--texture-line,1px), transparent var(--texture-line,1px) var(--texture-gap,3px));-webkit-backdrop-filter:blur(var(--texture-blur,12px)) saturate(var(--texture-sat,120%));backdrop-filter:blur(var(--texture-blur,12px)) saturate(var(--texture-sat,120%))}

/* NEON GRADIENT BORDER — border-only rim + glow (no fill gradient) */
.glass-neon{
  position:relative;
  border:1px solid transparent;
  background:
    linear-gradient(rgba(13,14,35,var(--neon-bgA,0.16)), rgba(13,14,35,var(--neon-bgA,0.16))) padding-box,
    linear-gradient(var(--neon-angle,135deg), var(--neon-colA,#8A2BE2), var(--neon-colB,#00D4FF)) border-box;
  -webkit-backdrop-filter:blur(var(--neon-blur,12px)) saturate(var(--neon-sat,120%));
  backdrop-filter:blur(var(--neon-blur,12px)) saturate(var(--neon-sat,120%));
}
.glass-neon::after{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:var(--neon-glowInset,1px);
  background: linear-gradient(var(--neon-angle,135deg), var(--neon-colA,#8A2BE2), var(--neon-colB,#00D4FF));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; /* Safari */
          mask-composite: exclude; /* Others */
  filter: drop-shadow(0 0 var(--neon-glowPx,10px) rgba(138,43,226,var(--neon-a,0.55)))
          drop-shadow(0 0 var(--neon-glowPx,10px) rgba(0,212,255,var(--neon-b,0.55)));
  pointer-events:none;
}

/* INSET BEVEL (4 sides) — keep inset shadows + independent outer shadow via var */
.glass-bevel{
  -webkit-backdrop-filter:blur(var(--bevel-blur,12px)) saturate(var(--bevel-sat,118%));
  backdrop-filter:blur(var(--bevel-blur,12px)) saturate(var(--bevel-sat,118%));
  box-shadow:
    inset 0 var(--bevel-px,2px) 0 rgba(255,255,255,var(--bevel-lightA,0.35)),
    inset 0 calc(-1 * var(--bevel-px,2px)) 0 rgba(0,0,0,var(--bevel-darkA,0.30)),
    inset var(--bevel-px,2px) 0 0 rgba(0,0,0,var(--bevel-darkA,0.30)),
    inset calc(-1 * var(--bevel-px,2px)) 0 0 rgba(255,255,255,var(--bevel-lightA,0.35)),
    0 8px 24px rgba(0,0,0,var(--outerA,.22));
}

/* RINGED — add BG alpha + blur + center controls */
.glass-ringed{
  position:relative;
  background-color: rgba(13,14,35, var(--ringed-bgA,0.16));
  -webkit-backdrop-filter: blur(var(--ringed-blur,12px)) saturate(var(--ringed-sat,120%));
  backdrop-filter: blur(var(--ringed-blur,12px)) saturate(var(--ringed-sat,120%));
}
.glass-ringed::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--ringed-alpha,0.35);
  background-image:repeating-radial-gradient(circle at var(--ringed-x,40%) var(--ringed-y,40%),
    rgba(255,255,255,0.14) 0 var(--ringed-dot,2px), transparent var(--ringed-dot,2px) var(--ringed-gap,18px));
  mix-blend-mode:screen;
}

/* MICRO-SCRATCHES — add BG alpha + blur controls */
.glass-scratched{
  position:relative;
  background-color: rgba(13,14,35, var(--scratch-bgA,0.14));
  -webkit-backdrop-filter: blur(var(--scratch-blur,10px)) saturate(var(--scratch-sat,115%));
  backdrop-filter: blur(var(--scratch-blur,10px)) saturate(var(--scratch-sat,115%));
}
.glass-scratched::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--scratch-alpha,0.25);
  background-image:repeating-linear-gradient(var(--scratch-angle,115deg),
    rgba(255,255,255,0.06) 0 var(--scratch-line,1px), transparent var(--scratch-line,1px) var(--scratch-gap,7px));
}

/* DOUBLE GLASS — two visible rims + independent outer shadow via var */
.glass-double{
  -webkit-backdrop-filter:blur(var(--double-blur,12px)) saturate(var(--double-sat,120%));
  backdrop-filter:blur(var(--double-blur,12px)) saturate(var(--double-sat,120%));
  background-color: rgba(13,14,35, var(--double-bgA,0.14));
  box-shadow:
    inset 0 0 0 var(--double-rim1Px,2px) rgba(255,255,255,var(--double-rim1,0.45)),
    inset 0 0 0 var(--double-rimPx,12px) rgba(255,255,255,var(--double-rim2,0.15)),
    0 10px 26px rgba(0,0,0,var(--outerA,.22));
}

/* DUOTONE PRISM EDGE — border-only gradient with overlay bg */
.glass-duoprism{
  position:relative;border:1px solid transparent;
  background:
    linear-gradient(rgba(13,14,35,var(--duo-bgA,0.14)), rgba(13,14,35,var(--duo-bgA,0.14))) padding-box,
    linear-gradient(90deg, rgba(0,212,255,var(--prism-a,0.55)), rgba(138,43,226,var(--prism-b,0.55))) border-box;
  background-blend-mode:screen;
  -webkit-backdrop-filter:blur(var(--duo-blur,12px)) saturate(var(--duo-sat,125%));
  backdrop-filter:blur(var(--duo-blur,12px)) saturate(var(--duo-sat,125%));
}

/* ACRYLIC & PAPER */
.glass-acrylic{background-color:rgba(20,28,58,var(--acrylic-bgA,0.28));-webkit-backdrop-filter:saturate(var(--acrylic-sat,180%)) blur(var(--acrylic-blur,20px));backdrop-filter:saturate(var(--acrylic-sat,180%)) blur(var(--acrylic-blur,20px));background-image:radial-gradient(rgba(255,255,255,var(--acrylic-noiseA,0.035)) 1px, transparent 1px);background-size:3px 3px;border-color:rgba(255,255,255,0.16)}
.glass-paper{background-color:rgba(13,14,35,var(--paper-bgA,0.16));background-image:radial-gradient(rgba(255,255,255,var(--paper-noiseA,0.06)) 1px, transparent 1px);background-size:var(--paper-size,2px) var(--paper-size,2px);-webkit-backdrop-filter:blur(var(--paper-blur,10px)) saturate(var(--paper-sat,115%));backdrop-filter:blur(var(--paper-blur,10px)) saturate(var(--paper-sat,115%))}
</style>
</head>
<body>
<div id="starfield"><div id="stars"></div><div id="stars1"></div></div>
<div id="noise-overlay"></div>
<header><h1>Glass Effects — Focus v14</h1></header>
<div class="container"><div class="grid" id="grid"></div></div>

<script>
/* ---------- Utils ---------- */
function getVar(card, name, fallback){ 
  const v = (card.style.getPropertyValue(name) || getComputedStyle(card).getPropertyValue(name) || '').trim();
  return v || (fallback ?? '');
}
function emit(list, s){ list.push(s); }
function block(list){ return list.join('\n'); }
const NO_BORDER = new Set(['glass-neon','glass-duoprism']); 

function addFrame(card, out){
  const cls = Array.from(card.classList).find(c => c.startsWith('glass-')) || '';
  const cs  = getComputedStyle(card);
  const bdw = cs.borderWidth;
  const bdc = cs.borderColor;
  const br  = cs.borderRadius;
  const bs  = cs.boxShadow;
  emit(out, '');
  emit(out, '/* Frame */');
  if (!NO_BORDER.has(cls)) emit(out, `border: ${bdw} solid ${bdc};`);
  emit(out, `border-radius: ${br};`);
  emit(out, `box-shadow: ${bs};`);
}

/* ---------- Copy builders (mirror slider state) ---------- */
const builders = {
  'glass-soft': (card)=>{
    const bgA = getVar(card,'--soft-bgA','0.10');
    const blur= getVar(card,'--soft-blur','6px');
    const sat = getVar(card,'--soft-sat','110%');
    const out = [];
    emit(out, `background-color: rgba(13, 14, 35, ${bgA});`);
    emit(out, `-webkit-backdrop-filter: blur(${blur}) saturate(${sat});`);
    emit(out, `backdrop-filter: blur(${blur}) saturate(${sat});`);
    addFrame(card, out); return block(out);
  },

  'glass-heavy': (card)=>{
    const bgA = getVar(card,'--heavy-bgA','0.22');
    const blur= getVar(card,'--heavy-blur','18px');
    const sat = getVar(card,'--heavy-sat','130%');
    const frost = getVar(card,'--heavy-frost','0.00');
    const out = [];
    emit(out, `background-color: rgba(13, 14, 35, ${bgA});`);
    emit(out, `background-image: linear-gradient(rgba(255,255,255, ${frost}), rgba(255,255,255, ${frost}));`);
    emit(out, `background-blend-mode: screen;`);
    emit(out, `-webkit-backdrop-filter: blur(${blur}) saturate(${sat});`);
    emit(out, `backdrop-filter: blur(${blur}) saturate(${sat});`);
    addFrame(card, out); return block(out);
  },

  'glass-dim': (card)=>{
    const bgA = getVar(card,'--dim-bgA','0.26');
    const blur= getVar(card,'--dim-blur','14px');
    const br  = getVar(card,'--dim-bright','0.90');
    const sat = getVar(card,'--dim-sat','115%');
    const out = [];
    emit(out, `background-color: rgba(13, 14, 35, ${bgA});`);
    emit(out, `-webkit-backdrop-filter: blur(${blur}) brightness(${br}) saturate(${sat});`);
    emit(out, `backdrop-filter: blur(${blur}) brightness(${br}) saturate(${sat});`);
    addFrame(card, out); return block(out);
  },

  'glass-bright': (card)=>{
    const bgA = getVar(card,'--bright-bgA','0.12');
    const blur= getVar(card,'--bright-blur','12px');
    const br  = getVar(card,'--bright-bright','1.08');
    const sat = getVar(card,'--bright-sat','125%');
    const out = [];
    emit(out, `background-color: rgba(13, 14, 35, ${bgA});`);
    emit(out, `-webkit-backdrop-filter: blur(${blur}) brightness(${br}) saturate(${sat});`);
    emit(out, `backdrop-filter: blur(${blur}) brightness(${br}) saturate(${sat});`);
    addFrame(card, out); return block(out);
  },

  'glass-tint-purple': (card)=>{
    const a   = getVar(card,'--tint-alpha','0.18');
    const blur= getVar(card,'--tint-blur','12px');
    const sat = getVar(card,'--tint-sat','120%');
    const out = [];
    emit(out, `background-color: rgba(115, 0, 255, ${a});`);
    emit(out, `-webkit-backdrop-filter: blur(${blur}) saturate(${sat});`);
    emit(out, `backdrop-filter: blur(${blur}) saturate(${sat});`);
    addFrame(card, out); return block(out);
  },

  'glass-glossy': (card)=>{
    const a = getVar(card,'--gloss-alpha','0.18');
    const out = [];
    emit(out, `/* ::before */`);
    emit(out, `content: ""; position: absolute; inset: 0; pointer-events: none;`);
    emit(out, `background: linear-gradient(180deg, rgba(255,255,255, ${a}), rgba(255,255,255,0) 35%);`);
    addFrame(card, out); return block(out);
  },

  'glass-texture': (card)=>{
    const a1  = getVar(card,'--texture-alpha','0.06');
    const a2  = getVar(card,'--texture-alpha2','0.05');
    const ln  = getVar(card,'--texture-line','1px');
    const gp  = getVar(card,'--texture-gap','3px');
    const blur= getVar(card,'--texture-blur','12px');
    const sat = getVar(card,'--texture-sat','120%');
    const out = [];
    emit(out, `background-image:`);
    emit(out, `  repeating-linear-gradient(0deg,  rgba(255,255,255, ${a1}) 0 ${ln}, transparent ${ln} ${gp}),`);
    emit(out, `  repeating-linear-gradient(90deg, rgba(255,255,255, ${a2}) 0 ${ln}, transparent ${ln} ${gp});`);
    emit(out, `-webkit-backdrop-filter: blur(${blur}) saturate(${sat});`);
    emit(out, `backdrop-filter: blur(${blur}) saturate(${sat});`);
    addFrame(card, out); return block(out);
  },

  'glass-neon': (card)=>{
    const ang = getVar(card,'--neon-angle','135deg');
    const glowPx = getVar(card,'--neon-glowPx','10px');
    const aA  = getVar(card,'--neon-a','0.55');
    const aB  = getVar(card,'--neon-b','0.55');
    const bgA = getVar(card,'--neon-bgA','0.16');
    const blur= getVar(card,'--neon-blur','12px');
    const sat = getVar(card,'--neon-sat','120%');
    const out = [];
    emit(out, `border: 1px solid transparent;`);
    emit(out, `background:`);
    emit(out, `  linear-gradient(rgba(13,14,35, ${bgA}), rgba(13,14,35, ${bgA})) padding-box,`);
    emit(out, `  linear-gradient(${ang}, var(--neon-colA,#8A2BE2), var(--neon-colB,#00D4FF)) border-box;`);
    emit(out, `-webkit-backdrop-filter: blur(${blur}) saturate(${sat});`);
    emit(out, `backdrop-filter: blur(${blur}) saturate(${sat});`);
    emit(out, `/* ::after for glow rim */`);
    emit(out, `content: ""; position: absolute; inset: 0; border-radius: inherit; padding: var(--neon-glowInset,1px);`);
    emit(out, `background: linear-gradient(${ang}, var(--neon-colA,#8A2BE2), var(--neon-colB,#00D4FF));`);
    emit(out, `-webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);`);
    emit(out, `-webkit-mask-composite: xor; mask-composite: exclude;`);
    emit(out, `filter: drop-shadow(0 0 ${glowPx} rgba(138,43,226, ${aA})) drop-shadow(0 0 ${glowPx} rgba(0,212,255, ${aB}));`);
    addFrame(card, out); return block(out);
  },

  'glass-bevel': (card)=>{
    const px  = getVar(card,'--bevel-px','2px');
    const la  = getVar(card,'--bevel-lightA','0.35');
    const da  = getVar(card,'--bevel-darkA','0.30');
    const blur= getVar(card,'--bevel-blur','12px');
    const sat = getVar(card,'--bevel-sat','118%');
    const out = [];
    emit(out, `-webkit-backdrop-filter: blur(${blur}) saturate(${sat});`);
    emit(out, `backdrop-filter: blur(${blur}) saturate(${sat});`);
    emit(out, `box-shadow:`);
    emit(out, `  inset 0 ${px} 0 rgba(255,255,255, ${la}),`);
    emit(out, `  inset 0 calc(-1 * ${px}) 0 rgba(0,0,0, ${da}),`);
    emit(out, `  inset ${px} 0 0 rgba(0,0,0, ${da}),`);
    emit(out, `  inset calc(-1 * ${px}) 0 0 rgba(255,255,255, ${la}),`);

/* ---------- DOM helpers ---------- */
function el(tag, attrs={}, children=[]){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k==='class') n.className = v;
    else if (k==='text') n.textContent = v;
    else if (k==='html') n.innerHTML = v;
    else n.setAttribute(k, v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{ if(c) n.appendChild(c); });
  return n;
}

function makeControl(ctrl, card, render){
  const w = el('div', {class:'control'});
  const label = el('label'); label.appendChild(document.createTextNode(ctrl.label+' '));
  const code = el('code', {text: ctrl.code}); label.appendChild(code);
  const input = el('input', {type:'range'});
  input.min = ctrl.min; input.max = ctrl.max; input.step = ctrl.step; input.value = ctrl.value;
  if (ctrl.varName) input.dataset.var = ctrl.varName;
  if (ctrl.prop) input.dataset.prop = ctrl.prop;
  if (ctrl.unit) input.dataset.unit = ctrl.unit;
  if (ctrl.apply) input.dataset.apply = ctrl.apply;
  const out = el('output', {text: String(ctrl.value) + (ctrl.unit||'')});
  w.append(label); w.append(input); w.append(out);

  const applyValue = (v)=>{
    const unit = input.dataset.unit || '';
    const s = unit ? (v + unit) : (''+v);
    if (input.dataset.var) card.style.setProperty(input.dataset.var, s);
    if (input.dataset.prop) card.style.setProperty(input.dataset.prop, s);
    // NEW: don't clobber inset shadows; use CSS var for outer shadow
    if (input.dataset.apply === 'outerA') card.style.setProperty('--outerA', v);
    if (input.dataset.apply === 'border-alpha') card.style.borderColor = `rgba(255,255,255, ${v})`;
    out.textContent = s;
    render();
  };
  applyValue(input.value);
  input.addEventListener('input', e => applyValue(e.target.value));
  return w;
}

function makeCard(cfg){
  const card = el('section', {class:`card ${cfg.cls}`});
  for (const [k,v] of Object.entries(cfg.style||{})) card.style.setProperty(k, v);
  card.append(
    el('span', {class:'pill', text: cfg.pill}),
    el('div', {class:'title', text: cfg.title}),
    el('div', {class:'meta', text: cfg.meta}),
  );
  const controls = el('div', {class:'controls'});
  const decls = el('div', {class:'decls'});
  const pre = el('pre', {class:'decl-pre'});
  decls.append(pre);
  const actions = el('div', {class:'actions'});
  const copyBtn = el('button', {class:'copy', text:'Copy Declarations'});
  actions.append(copyBtn);

  const render = ()=>{ pre.textContent = (builders[cfg.cls]||(()=>''))(card); };
  (cfg.controls||[]).forEach(c => controls.append( makeControl(c, card, render) ));
  render();
  copyBtn.addEventListener('click', (e)=>{
    const text = pre.textContent || '';
    const ok = (msg)=>{ const t=e.target.textContent; e.target.textContent=msg||'Copied!'; setTimeout(()=>e.target.textContent=t,1200); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>ok()).catch(()=>fallback());
    } else { fallback(); }
    function fallback(){
      const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
      ta.focus(); ta.select(); try{ document.execCommand('copy'); }catch(_){}
      document.body.removeChild(ta); ok();
    }
  });

  card.append(controls, decls, actions);
  return card;
}

const grid = document.getElementById('grid');
CARDS.forEach(cfg => grid.append( makeCard(cfg) ));
</script>
</body>
